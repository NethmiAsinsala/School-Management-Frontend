<div class="stat-card">
  <div class="icon-box" [ngClass]="'theme-' + theme">
    <svg *ngIf="icon === 'users'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="8" r="3" fill="currentColor"/><circle cx="17" cy="9" r="2.5" fill="currentColor" opacity="0.6"/><path d="M3 20C3 16.69 5.69 14 9 14C12.31 14 15 16.69 15 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15.5 14.5C18 14.8 20 16.9 20 19.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/></svg>
    <svg *ngIf="icon === 'book'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 4.5C4 3.67 4.67 3 5.5 3H12V21H5.5C4.67 21 4 20.33 4 19.5V4.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M20 4.5C20 3.67 19.33 3 18.5 3H12V21H18.5C19.33 21 20 20.33 20 19.5V4.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <svg *ngIf="icon === 'document'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 2H15L19 6V22H6V2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 11H15M9 15H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <svg *ngIf="icon === 'user-check'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 20C3 16.41 6.13 13.5 10 13.5C11.2 13.5 12.33 13.79 13.32 14.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M16 16.5L18 18.5L22 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="stat-label">{{ label }}</div>
  <div class="stat-value">{{ value }}<span class="value-suffix" *ngIf="valueSuffix">{{ valueSuffix }}</span></div>

  <div class="stat-trend" [ngClass]="'trend-' + trendType" *ngIf="trendText">
    <svg *ngIf="trendType === 'up'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg *ngIf="trendType === 'down'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 7L17 17M17 17H9M17 17V9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <svg *ngIf="trendType === 'neutral'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    {{ trendText }}
  </div>
</div>
