<app-page-header></app-page-header>

<div class="dashboard-body">

  <!-- Hero banner -->
  <div class="hero-banner">
    <div class="hero-text">
      <h1>Dashboard Overview</h1>
      <p>Welcome back. Here is the daily summary for today.</p>
    </div>
    <div class="hero-actions">
      <button class="btn-secondary" (click)="onExportReports()">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3V15M12 15L8 11M12 15L16 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17V19C4 20.1 4.9 21 6 21H18C19.1 21 20 20.1 20 19V17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Export Reports
      </button>
      <button class="btn-primary" (click)="onAddStudent()">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/><path d="M2 20C2 16.13 5.13 13 9 13C10.5 13 11.89 13.46 13.03 14.24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 9V15M15 12H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Add Student
      </button>
    </div>
  </div>

  <div class="content-grid">
    <!-- Main column -->
    <div class="main-col">

      <div class="stats-row">
        <app-stat-card
          icon="users"
          theme="blue"
          label="Total Students"
          [value]="totalStudents"
          trendText="Live total"
          trendType="up"
        ></app-stat-card>

        <app-stat-card
          icon="book"
          theme="purple"
          label="Faculty Members"
          [value]="totalStaff"
          trendText="Live total"
          trendType="neutral"
        ></app-stat-card>

        <app-stat-card
          icon="document"
          theme="violet"
          label="Active Exams"
          [value]="totalExams"
          trendText="Live total"
          trendType="neutral"
        ></app-stat-card>

        <app-stat-card
          icon="user-check"
          theme="blue"
          label="Daily Attendance"
          [value]="attendanceRate"
          trendText="No attendance summary"
          trendType="down"
        ></app-stat-card>
      </div>

      <app-attendance-chart></app-attendance-chart>

      <app-recent-enrollments></app-recent-enrollments>
    </div>

    <!-- Side column -->
    <div class="side-col">
      <app-quick-actions></app-quick-actions>
      <app-upcoming-events></app-upcoming-events>

      <div class="update-banner">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 8V13M12 16H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <div>
          <strong>System Update Scheduled</strong>
          <p>The portal will be down for maintenance tonight from 11 PM.</p>
        </div>
      </div>
    </div>
  </div>
</div>
