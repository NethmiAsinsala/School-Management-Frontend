<section class="lumina-page"><header class="lumina-heading"><div><h1>School Settings</h1><p>Maintain the school identity and operating hours shown across the portal.</p></div></header><div *ngIf="loading" class="lumina-card lumina-empty">Loading settings…</div><form *ngIf="!loading" class="lumina-card lumina-form" (ngSubmit)="save()"><label>School name<input [(ngModel)]="settings.schoolName" name="schoolName"></label><label>School code<input [(ngModel)]="settings.schoolCode" name="schoolCode"></label><label>Official email<input [(ngModel)]="settings.email" name="email" type="email"></label><label>Phone number<input [(ngModel)]="settings.phoneNumber" name="phone"></label><label>Principal name<input [(ngModel)]="settings.principalName" name="principal"></label><label>Principal title<input [(ngModel)]="settings.principalTitle" name="principalTitle"></label><label>School start time<input [(ngModel)]="settings.schoolStartTime" name="start" type="time"></label><label>School end time<input [(ngModel)]="settings.schoolEndTime" name="end" type="time"></label><label>Default language<input [(ngModel)]="settings.defaultLanguage" name="language"></label><label>Time zone<input [(ngModel)]="settings.timeZone" name="timezone"></label><label class="wide">School address<textarea [(ngModel)]="settings.address" name="address" rows="3"></textarea></label><div class="wide"><button class="lumina-button" [disabled]="saving">{{ saving ? 'Saving…' : 'Save changes' }}</button></div></form></section>
