<div class="login-page">
  <div class="login-wrapper">

    <!-- Brand header -->
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L1 9L12 15L21 10.09V17H23V9L12 3Z" fill="currentColor"/>
          <path d="M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z" fill="currentColor"/>
        </svg>
      </div>
      <h1 class="brand-title">Academix Admin</h1>
      <p class="brand-subtitle">School Management System</p>
    </div>

    <!-- Login card -->
    <div class="login-card">
      <h2 class="welcome-title">Welcome Back</h2>
      <p class="welcome-subtitle">Please sign in to your account</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="admin@school.edu"
            class="form-input"
            [class.input-error]="email?.invalid && email?.touched"
            autocomplete="email"
          />
          <span class="error-text" *ngIf="email?.invalid && email?.touched">
            Please enter a valid email address
          </span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <span class="field-icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17 8V7C17 4.24 14.76 2 12 2C9.24 2 7 4.24 7 7V8C5.9 8 5 8.9 5 10V20C5 21.1 5.9 22 7 22H17C18.1 22 19 21.1 19 20V10C19 8.9 18.1 8 17 8ZM9 7C9 5.34 10.34 4 12 4C13.66 4 15 5.34 15 7V8H9V7Z" fill="currentColor"/>
              </svg>
            </span>
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="••••••••••••"
              class="form-input with-icon"
              [class.input-error]="password?.invalid && password?.touched"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="toggle-visibility"
              (click)="togglePasswordVisibility()"
              aria-label="Toggle password visibility"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12C2.73 16.39 7 19.5 12 19.5C17 19.5 21.27 16.39 23 12C21.27 7.61 17 4.5 12 4.5ZM12 17C9.24 17 7 14.76 7 12C7 9.24 9.24 7 12 7C14.76 7 17 9.24 17 12C17 14.76 14.76 17 12 17ZM12 9C10.34 9 9 10.34 9 12C9 13.66 10.34 15 12 15C13.66 15 15 13.66 15 12C15 10.34 13.66 9 12 9Z" fill="currentColor"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 6C7 6 2.73 9.11 1 13.5C1.73 15.36 2.96 16.96 4.51 18.14L2.1 20.55L3.51 21.96L21.96 3.51L20.55 2.1L17.62 5.03C15.86 4.37 13.98 4 12 4V6ZM3.51 3.51L2.1 4.92L5.35 8.17C3.55 9.42 2.09 11.24 1 13.5C2.73 17.89 7 21 12 21C13.99 21 15.87 20.63 17.62 19.97L20.49 22.84L21.9 21.43L3.51 3.51ZM12 17C9.24 17 7 14.76 7 12C7 11.29 7.15 10.62 7.42 10.01L9.5 12.09C9.5 12.06 9.5 12.03 9.5 12C9.5 13.38 10.62 14.5 12 14.5C12.03 14.5 12.06 14.5 12.09 14.5L14.17 16.58C13.56 16.85 12.89 17 12 17ZM11.8 9.02L14.98 12.2C14.98 12.13 15 12.07 15 12C15 10.62 13.88 9.5 12.5 9.5C12.43 9.5 12.37 9.52 12.3 9.52L11.8 9.02Z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <span class="error-text" *ngIf="password?.invalid && password?.touched">
            Password must be at least 6 characters
          </span>
        </div>

        <!-- Remember / Forgot -->
        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="rememberMe" />
            <span>Remember Me</span>
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
        </button>

        <!-- Footer info -->
        <div class="card-footer">
          <span class="footer-item">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 1L3 5V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V5L12 1Z" fill="currentColor"/>
            </svg>
            Secure SSL Connection
          </span>
          <a href="#" class="footer-item link">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 19H11V17H13V19ZM15.07 11.25L14.17 12.17C13.45 12.9 13 13.5 13 15H11V14.5C11 13.4 11.45 12.4 12.17 11.67L13.41 10.41C13.78 10.05 14 9.55 14 9C14 7.9 13.1 7 12 7C10.9 7 10 7.9 10 9H8C8 6.79 9.79 5 12 5C14.21 5 16 6.79 16 9C16 9.88 15.64 10.68 15.07 11.25Z" fill="currentColor"/>
            </svg>
            Help &amp; Support
          </a>
        </div>
      </form>
    </div>

    <p class="page-footer">© 2024 The Academic Curator. All Rights Reserved.</p>
  </div>
</div>
